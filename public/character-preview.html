<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepSeek 娘 · 像素动作预览</title>
<style>
:root{color-scheme:dark;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#13111c;color:#f1eef8}
*{box-sizing:border-box}
body{margin:0;padding:40px 20px;min-height:100vh;background:radial-gradient(840px 440px at 18% -8%,rgba(196,165,238,.1),transparent 65%),radial-gradient(720px 380px at 85% -4%,rgba(244,185,66,.08),transparent 62%),#13111c}
main{max-width:1040px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px;padding:16px 22px;background:#1c1929;border:1px solid #383250;border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 8px 24px rgba(6,5,12,.34)}
h1{font-size:24px;margin:0 0 6px}p{color:#a098b8;line-height:1.65;margin:0}
a{display:inline-flex;align-items:center;padding:7px 14px;border-radius:8px;background:#252136;border:1px solid #383250;color:#f1eef8;text-decoration:none;font-size:13.5px;transition:background-color .14s,border-color .14s}
a:hover{background:#2f2a44;border-color:#514970}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
article{background:#1c1929;border:1px solid #383250;border-radius:16px;padding:24px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 8px 24px rgba(6,5,12,.3);transition:border-color .14s,transform .14s}
article:hover{border-color:#514970;transform:translateY(-2px)}
h2{font-size:17px;margin:0 0 4px}article p{font-size:13px}
canvas{display:block;width:240px;height:264px;max-width:100%;object-fit:contain;image-rendering:pixelated;margin:20px auto 8px;border-radius:10px;background:#13111c;border:1px solid #383250}
footer{display:flex;gap:16px;align-items:center;justify-content:center;margin-top:28px}
button{font:inherit;font-weight:600;background:linear-gradient(180deg,#f7c557 0%,#ebb035 100%);color:#18130a;border:1px solid #f8cd6c;border-radius:8px;padding:9px 22px;cursor:pointer;box-shadow:0 4px 14px rgba(244,185,66,.24)}
button:hover:not(:disabled){filter:brightness(1.05)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,a:focus-visible{outline:2px solid #f4b942;outline-offset:3px}
#status{font-size:13px;color:#a098b8}
@media(max-width:720px){.gallery{grid-template-columns:1fr}body{padding:24px 16px}}
</style>
</head>
<body><main>
<header><div><h1>DeepSeek 娘 · 像素动作预览</h1><p>看看她休息、走路和工作时的像素小模样。</p></div><a href="/">← 返回工作室</a></header>
<section class="gallery" aria-label="角色动作">
<article><h2>休息</h2><p>眨眨眼，轻轻晃动发梢</p><canvas width="480" height="528" role="img" aria-label="休息和眨眼动画" data-pose="idle"></canvas></article>
<article><h2>走路</h2><p>交替迈步，摆动双臂</p><canvas width="480" height="528" role="img" aria-label="走路动画" data-pose="walk"></canvas></article>
<article><h2>工作</h2><p>专心打字，轮流敲动双手</p><canvas width="480" height="528" role="img" aria-label="打字动画" data-pose="work"></canvas></article>
</section>
<footer><button id="toggle" disabled>暂停动画</button><span id="status" role="status">正在加载动作…</span></footer>
</main>
<script type="module">
import {characterFrame,loadCharacterFrames} from './character-animation.js';
const toggle=document.querySelector('#toggle'),status=document.querySelector('#status');
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
let running=!reduce.matches,elapsed=0,last=performance.now();
const showStatus=()=>{toggle.textContent=running?'暂停动画':'播放动画';status.textContent=running?'动画播放中':'动画已暂停';};
toggle.addEventListener('click',()=>{running=!running;showStatus();});
try{
  const frames=await loadCharacterFrames();
  const items=[...document.querySelectorAll('canvas')].map(canvas=>({canvas,context:canvas.getContext('2d'),who:{name:'',path:canvas.dataset.pose==='walk'?[{}]:[],writing:canvas.dataset.pose==='work'?{}:null}}));
  toggle.disabled=false;showStatus();
  function draw(now){
    if(running)elapsed+=Math.min(.1,(now-last)/1000);last=now;
    for(const {canvas,context,who} of items){
      context.clearRect(0,0,canvas.width,canvas.height);context.imageSmoothingEnabled=false;
      context.drawImage(frames[characterFrame(who,elapsed)],0,0,canvas.width,canvas.height);
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}catch(error){status.textContent='动画加载失败，请刷新重试。';console.error(error);}
</script>
</body></html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 工作室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: status bar on top; left = pixel office + work board, right = what waits for you + staff. One committed night-shift palette. */
:root{
  --bg:#1b1824;
  --panel:#25212f;
  --panel-2:#2f2a3c;
  --line:#463e5a;
  --text:#ebe6f2;
  --muted:#a69fb8;
  --accent:#f2b544;
  --ok:#78cfa2;
  --bad:#ee7b86;
  --info:#7fb6e6;
  --violet:#c3a6ea;
  --font-pixel:"Pixelify Sans","PingFang SC","Microsoft YaHei",monospace;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.px{background:var(--panel);border:2px solid var(--line);box-shadow:4px 4px 0 rgba(0,0,0,.35)}
.btn{background:var(--panel-2);border:2px solid var(--line);padding:5px 12px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.28);
  font-family:var(--font-pixel);font-size:14px;letter-spacing:.02em;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.28)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
#autoBtn[aria-pressed="true"]{background:var(--panel-2);border-color:var(--ok);color:var(--ok)}
a.btn{display:inline-block;color:var(--text);text-decoration:none}
.brand .sub{max-width:52ch}
.num{font-family:var(--font-pixel);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.08em;color:var(--muted)}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:10px 14px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-family:var(--font-pixel);font-size:22px;letter-spacing:.04em}
.brand .sub{font-size:12px;color:var(--muted)}
.logo{width:28px;height:28px;flex:none;background:
  linear-gradient(var(--accent),var(--accent)) 6px 4px/16px 6px no-repeat,
  linear-gradient(#f0c9a0,#f0c9a0) 8px 10px/12px 8px no-repeat,
  linear-gradient(var(--ok),var(--ok)) 4px 18px/20px 8px no-repeat;image-rendering:pixelated}
.clock{display:flex;flex-direction:column;align-items:flex-start}
.clock .num{font-size:22px;line-height:1}
.funds{display:flex;flex-direction:column;gap:3px;min-width:170px}
.funds .row{display:flex;align-items:center;gap:8px}
.bar{flex:1;height:10px;background:var(--bg);border:2px solid var(--line);position:relative;min-width:90px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);width:100%}
.funds b{font-size:16px}
.speed{display:flex;gap:4px}
.actions{display:flex;gap:6px;flex-wrap:wrap}

/* main layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;align-items:start}
.left,.right{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}

.stage-wrap{padding:6px;position:relative}
.stage{position:relative;width:100%;aspect-ratio:384/224;max-width:100%;background:#57506a}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation}
.overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.room-label{position:absolute;font-size:clamp(8px,1.15vw,11px);padding:1px 5px;background:rgba(27,24,36,.72);color:var(--text);white-space:nowrap;letter-spacing:.06em}
.room-label.locked{color:var(--accent)}
.you{position:absolute;transform:translate(-50%,0);font-family:var(--font-pixel);font-size:clamp(8px,1.1vw,11px);color:var(--accent);white-space:nowrap}
.tag{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:3px;font-size:clamp(8px,1.1vw,11px);
  padding:0 4px;background:rgba(27,24,36,.82);border:1px solid var(--line);white-space:nowrap;line-height:1.5}
.tag.sel{border-color:var(--accent)}
.tag .st{font-family:var(--font-pixel);font-weight:700;min-width:0}
.tag .st:empty{display:none}
.tag .st.warn{color:var(--bg);background:var(--accent);padding:0 3px;animation:bob .7s steps(2) infinite}
.tag .st.work{color:var(--info)}
.tag .st.meet{color:var(--ok)}
.tag .st.tired{color:var(--bad)}
@keyframes bob{50%{transform:translateY(-2px)}}
.bubble{position:absolute;transform:translate(-50%,-100%);max-width:min(46%,210px);padding:4px 7px;font-size:clamp(9px,1.15vw,12px);line-height:1.4;
  background:var(--text);color:var(--bg);border:2px solid var(--bg);box-shadow:2px 2px 0 rgba(0,0,0,.35);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bubble.think{background:#d9d3e6;font-style:italic}
.bubble.tool{background:#cfe6f5;font-family:ui-monospace,Consolas,monospace}
.proto-flag{position:absolute;right:8px;bottom:8px;font-size:11px;color:var(--muted);background:rgba(27,24,36,.8);padding:1px 6px;pointer-events:none}
@media (max-width:600px){.proto-flag{display:none}}

/* work board: what is being done right now, then the orders nobody has taken yet */
.board{padding:12px;display:flex;flex-direction:column;gap:10px}
.board-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.board-head h2,.queue h2,.tabs{font-family:var(--font-pixel);font-size:18px}
.board-head p{color:var(--muted);font-size:13px;flex:1;min-width:200px}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.order{background:var(--panel-2);border:2px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:grab;touch-action:none;user-select:none;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.order:hover{border-color:var(--accent)}
.order h3{font-size:15px}
.order p{font-size:13px;color:var(--muted)}
.order .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:auto}
.order .meta .grab{color:var(--accent)}
.order.dragging{opacity:.4}
.empty{color:var(--muted);font-size:13px}
.sub-h{font-size:13px;color:var(--muted);letter-spacing:.06em}
.active{display:flex;flex-direction:column;gap:6px}
.work{background:var(--panel-2);border:2px solid var(--line);padding:7px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;
  text-align:left;width:100%}
.work:hover{border-color:var(--muted)}
.work b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.work .who{font-size:12px;color:var(--muted);grid-column:1}
.work .st{grid-row:1/3;grid-column:2;align-self:center;font-size:12px}
.work.wait-you{border-color:var(--accent)}
.work .roles{grid-column:1/3;display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.work .roles span{font-size:11px;padding:0 5px;border:1px solid var(--line)}
.post{font-size:11px;padding:0 5px;border:1px solid var(--violet);color:var(--violet);white-space:nowrap}
.order .meta .queued{color:var(--muted)}
/* segmented choice: one of a few options, all visible */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{flex:1 1 150px;display:flex;flex-direction:column;gap:2px;border:2px solid var(--line);padding:6px 9px;cursor:pointer;background:var(--bg);color:var(--text);font-size:13px}
.seg label small{color:var(--muted);font-size:12px}
.seg label:has(input:checked){border-color:var(--accent)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.modes{display:flex;gap:4px}
.who-hint{font-size:12px;color:var(--info)}
.order-form details summary{cursor:pointer;font-size:13px;color:var(--info)}
.order-form details[open]{display:flex;flex-direction:column;gap:10px}
/* staff roster: everyone at a glance, the selected person opens below */
.roster{display:flex;flex-direction:column;gap:4px}
.mate{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:4px 6px;border:2px solid transparent;text-align:left;width:100%}
.mate:hover{border-color:var(--line)}
.mate[aria-pressed="true"]{border-color:var(--accent);background:var(--panel-2)}
.mate .nm{font-weight:600;min-width:0}
.mate .nm small{font-weight:400;color:var(--muted);margin-left:6px;font-size:12px}
.mate .stt{font-size:12px;color:var(--muted);white-space:nowrap}
.mate .stt.busy{color:var(--info)}
.mate .stt.you{color:var(--accent)}
.detail{display:flex;flex-direction:column;gap:10px;border-top:2px solid var(--line);padding-top:10px}
.post-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.post-row select{background:var(--bg);border:2px solid var(--line);color:var(--text);padding:3px 6px;font:inherit;font-size:13px}
.more summary{cursor:pointer;font-size:13px;color:var(--info)}
.more[open]{display:flex;flex-direction:column;gap:8px}

.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;background:var(--accent);color:var(--bg);padding:5px 10px;font-weight:600;font-size:13px;
  border:2px solid var(--bg);box-shadow:3px 3px 0 rgba(0,0,0,.4);transform:translate(-50%,-130%);white-space:nowrap}

/* queue */
.queue{padding:12px;display:flex;flex-direction:column;gap:10px}
.ask{background:var(--panel-2);border:2px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:7px}
.ask.high{border-color:var(--accent)}
.ask header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.pill{font-size:11px;padding:0 6px;border:1px solid currentColor;letter-spacing:.06em}
.ask.low .pill{color:var(--ok)}
.ask.high .pill{color:var(--accent)}
.ask h3{font-size:15px}
.ask p{font-size:13px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:6px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);padding:6px 9px;font-size:13px}
.opt:hover{border-color:var(--text)}
.opt.yes{border-color:var(--ok);color:var(--ok)}
.opt.no{border-color:var(--bad);color:var(--bad)}
.opt b{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.04em}
.link{color:var(--info);font-size:12px;text-align:left;text-decoration:underline;text-underline-offset:3px}

/* inspector */
.inspector{padding:12px;display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line)}
.tabs button{padding:4px 10px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.sw{width:10px;height:10px;flex:none;border:1px solid rgba(0,0,0,.4)}
.emp-head{display:flex;gap:10px;align-items:center}
.emp-head .sw{width:26px;height:26px}
.emp-head h3{font-size:17px}
.emp-head p{font-size:12px;color:var(--muted)}
.traits{display:flex;gap:5px;flex-wrap:wrap}
.traits span{font-size:12px;padding:0 6px;background:var(--bg);border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;align-items:center}
.stats dt{color:var(--muted)}
.stats dd{margin:0}
.pips{font-family:var(--font-pixel);letter-spacing:2px;color:var(--accent)}
.pips i{font-style:normal;color:var(--line)}
.stam{display:flex;align-items:center;gap:8px}
.stam .bar i{background:var(--ok)}
.stam.low .bar i{background:var(--bad)}
.now{font-size:13px;background:var(--bg);border:1px solid var(--line);padding:6px 8px}
.now b{color:var(--accent);font-weight:600}
.log{list-style:none;margin:0;padding:0;max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;font-size:13px;
  border-top:1px solid var(--line);padding-top:8px}
.log li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:2px 8px}
.log .t{color:var(--muted);font-size:11px;padding-top:2px}
.log .x{min-width:0;overflow-wrap:anywhere}
.log .k{font-size:11px;padding:0 4px;margin-right:4px;border:1px solid currentColor}
.log .w{color:var(--muted);margin-right:4px}
.log .c{color:var(--muted);font-size:11px;margin-left:6px}
.log .think .x{color:var(--muted);font-style:italic}
.log .tool .k{color:var(--info)}
.log .tool .x{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.log .ask .k{color:var(--accent)}
.log .boss .k{color:var(--accent)}
.log .boss .x{color:var(--accent)}
.log .pass .k{color:var(--violet)}
.log .pass .x{color:var(--violet)}
.log .sys .k{color:var(--ok)}
.log .sys .x{color:var(--ok)}
.row-btns{display:flex;gap:6px;flex-wrap:wrap}

.wall{display:flex;flex-direction:column;gap:8px}
.wall details{background:var(--panel-2);border:2px solid var(--line);padding:8px 10px}
.wall summary{cursor:pointer;font-weight:600}
.wall summary span{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.wall details p{font-size:13px;margin-top:6px}
.wall ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--accent)}

/* menu, modal, toast */
.menu{position:absolute;z-index:40;min-width:230px;padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--panel)}
.menu .lbl{font-size:12px;color:var(--muted);padding:2px 6px}
.menu button{text-align:left;padding:6px 8px;border:2px solid transparent;font-size:13px;display:flex;align-items:center;gap:8px}
.menu button:hover:not(:disabled){border-color:var(--accent)}
.menu small{color:var(--muted);margin-left:auto;padding-left:10px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,8,16,.7);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal-card{width:min(640px,100%);max-height:100%;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.modal-card h2{font-family:var(--font-pixel);font-size:22px}
.modal-card h3{font-size:14px;color:var(--muted);letter-spacing:.06em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.bonds{display:flex;flex-direction:column;gap:3px;font-size:13px}
.bonds div{display:flex;align-items:center;gap:8px}
.bonds small{color:var(--muted);margin-left:auto}
.kpis div{background:var(--panel-2);border:2px solid var(--line);padding:8px 10px}
.kpis .num{font-size:24px;display:block}
.kpis span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.kpis{grid-template-columns:minmax(0,1fr)}}
.modal-card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.cand{background:var(--panel-2);border:2px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px}
.cand h4{margin:0;font-size:15px;display:flex;align-items:center;gap:6px}
.cand p{font-size:12px;color:var(--muted)}
.cand .btn{margin-top:auto}
.cand input,.cand textarea,.cand select{background:var(--bg);border:2px solid var(--line);color:var(--text);padding:4px 8px;font:inherit;font-size:13px;width:100%}
.order .tags{display:flex;flex-wrap:wrap;gap:4px}
.order .tags .pill{color:var(--muted)}
.order .tags .pill.urgent,.order.urgent h3{color:var(--bad)}
.order.urgent{border-color:var(--bad)}
.order-form{display:flex;flex-direction:column;gap:10px}
.field-row{display:flex;gap:10px;flex-wrap:wrap}
.field-row .field{flex:0 1 auto}
.field-row .field.grow{flex:1 1 200px}
.field select{background:var(--bg);border:2px solid var(--line);color:var(--text);padding:6px 8px;font:inherit;font-size:13px}
.order-form .chk{display:flex;gap:8px;align-items:center;font-size:13px}
.plan-text{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);padding:8px;font:inherit;font-size:13px;max-height:260px;overflow:auto;margin:0}
.portrait{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:var(--bg);border:2px solid var(--line)}
.portrait.art{border-color:transparent;background:none}
.pslot{flex:none;display:block}
.cand h4{gap:10px}
.cand h4 small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.persona{display:flex;flex-direction:column;gap:4px;font-size:13px}
.persona p{color:var(--text)}
.persona textarea{background:var(--bg);border:2px solid var(--line);color:var(--text);padding:6px 8px;font:inherit;font-size:13px;width:100%}
.toasts{position:fixed;z-index:70;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:min(520px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--panel);border:2px solid var(--line);padding:7px 12px;font-size:13px;box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.toast.ok{border-color:var(--ok)}
.toast.warn{border-color:var(--accent)}
/* review, growth, onboarding */
.ask.review{border-color:var(--violet)}
.ask.review .pill{color:var(--violet)}
.dec{margin:0;padding-left:18px;font-size:12px;color:var(--accent)}
.cost{font-size:12px;color:var(--muted)}
.reasons{display:flex;flex-direction:column;gap:6px}
.say-form{display:flex;gap:6px}
.say-form input{flex:1;min-width:0;background:var(--bg);border:2px solid var(--line);color:var(--text);padding:5px 8px;font:inherit;font-size:13px}
.prefs ul{margin:4px 0 0;padding-left:18px;font-size:13px}
.bar.xp i{background:var(--violet)}
.bubble.lv{background:var(--accent);font-weight:700;font-style:normal}
.ghost.ok{background:var(--ok)}
.ghost.bad{background:var(--bad)}
.menu button[aria-pressed="true"]{border-color:var(--accent);background:var(--panel-2)}
.menu .btn.primary{justify-content:center;margin-top:4px}
.stars{color:var(--accent);font-weight:400;margin-left:4px}
.pill.new{color:var(--accent);margin-right:4px;vertical-align:2px}
/* work planner */
.modal-card.wide{width:min(1000px,100%)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field textarea,.role input,.role textarea,.role select{background:var(--bg);border:2px solid var(--line);color:var(--text);padding:6px 8px;font:inherit;font-size:13px;width:100%;min-width:0}
.tpl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.role{background:var(--panel-2);border:2px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.role-head{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,120px) auto;gap:6px;align-items:center}
.role-head .num{font-family:var(--font-pixel);font-size:18px;color:var(--accent);min-width:16px}
.role-head button{padding:2px 9px;color:var(--muted);border:2px solid var(--line)}
.role-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.role-row label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);flex:1;min-width:140px}
.role-row label.chk{flex-direction:row;align-items:center;gap:6px;flex:none;min-width:0;font-size:13px;color:var(--text)}

<script>

let uidN=0;const uid=()=>'id'+(++uidN);
const yuan=n=>'¥'+n.toFixed(2);

/* ---------- company backend: records everything; without it the page runs as an offline demo ---------- */
const API={on:false,buf:{activity:[],ledger:[]},empDirty:false,
  async boot(){
    try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok) return null;const s=await r.json();if(!s||!Array.isArray(s.employees)) return null;this.on=true;return s;}
    catch{return null;}
  },
  post(url,body){
    if(!this.on) return Promise.resolve(null);
    return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(r=>r.json().then(d=>r.ok?d:Promise.reject(new Error(d.error||r.status))))
      .catch(err=>{console.warn(err);toast('写入公司系统失败：'+err.message,'warn');return null;});
  },
  activity(e,entry){
    if(!this.on) return;
    const a=this.buf.activity,last=a[a.length-1],text=(entry.who?entry.who+'：':'')+entry.text;
    // the same line logged to several teammates is one event
    if(last&&last.text===text&&last.time===entry.t){if(!last.actor.includes(e.name)) last.actor+='、'+e.name;return;}
    a.push({actor:e.name,kind:entry.kind,text,task:e.job?.task.title||null,day:state.day,time:entry.t});
  },
  ledger(e,tokens,cost){if(this.on) this.buf.ledger.push({employee:e.id,tokens,cost,task:e.job?.task.title||null,day:state.day});},
  flush(){
    if(!this.on) return;
    const b=this.buf;
    if(b.activity.length||b.ledger.length){this.buf={activity:[],ledger:[]};this.post('/api/events',b);}
    if(this.empDirty){this.empDirty=false;this.post('/api/employees/sync',state.emps.map(empSnapshot));}
  },
};
setInterval(()=>API.flush(),1500);
function empSnapshot(e){
  return {id:e.id,name:e.name,model:e.model,level:e.level,xp:e.xp,speed:e.speed,memory:e.memory,stamina:Math.round(e.stamina),spent:+e.spent.toFixed(4),
    prefs:e.prefs,bond:e.bond,profile:{type:e.type,variant:e.variant,persona:e.persona||'',post:e.post,postLabel:POSTS[e.post].label,shirt:e.shirt,hair:e.hair,skin:e.skin,traits:e.traits,price:e.price,needs:e.needs||null,pitch:e.pitch}};
}
// someone writing a deliverable or standing at the door can't take new work
const busy=e=>!!(e.job||e.writing||e.waiting);
let MODELS=null;
// the model that really writes for this employee, or null when none is connected
function modelLabel(e){
  if(!MODELS) return null;

  const p=MODELS.providers[MODELS.types[e.type]];
  return p?p.model:null;
}
function modelStatus(type){
  if(!MODELS) return '演示模式：不调用模型';
  if(MODELS.fake) return '模型：测试替身';
  const p=MODELS.providers[MODELS.types[type]];
  return p?`${p.configured?'由':'应由'} ${p.name} 干活（${p.hint}）`:'还没接入真实模型，交付物用模板';
}
function chargeReal(e,cny){state.funds-=cny;e.spent+=cny;state.stats.spent+=cny;API.empDirty=true;}
const orderRecord=(t,source)=>({id:t.id,title:t.title,brief:t.brief,est:t.est,task_key:TASKS.includes(t)?t.id:null,source,spec:t.spec||null});
// what the boss asked for in an order; preset orders only have their one-line brief
// post: which post handles it ('' = guess from the text); check: how closely the boss looks (auto / review / strict); manual: wait for the boss to assign
// (orders saved before there were check levels only had planFirst, which is what strict means)
function specOf(t){
  const s={detail:'',deliverable:{kind:'doc',name:''},criteria:[],refs:'',priority:'normal',planFirst:false,post:'',check:'review',manual:false,...(t.spec||{detail:t.brief})};
  if(!t.spec?.check&&s.planFirst) s.check='strict';
  s.planFirst=s.check==='strict';
  return s;
}
const CHECKS={
  auto:{label:'放手',desc:'做完自动验收，只记录。模型没写成时还是会给你看'},
  review:{label:'验收',desc:'过程中的决定员工自己拿主意，你只看最终交付'},
  strict:{label:'严查',desc:'先给你看计划，同事交叉审查，过程中的决定都问你'},
};
function logArtifacts(e,arts){
  const fmt=a=>({llm:`用 ${a.model} 写完：${a.output_tokens?`输入 ${a.input_tokens} / 输出 ${a.output_tokens}`:`共 ${a.input_tokens}`} token${a.cny!=null?`，约 ¥${a.cny.toFixed(2)}`:a.plan_usd!=null?`，走你的订阅额度（折合 API 价约 $${a.plan_usd.toFixed(2)}）`:'，走你的账号额度'}，用时 ${Math.round(a.ms/1000)} 秒`,
    fallback:`模型没写成，改用模板：${a.reason}`,db_error:`业务数据库没建成：${a.reason}`,doc:`文档存入文档库：${a.path}`,commit:`提交 ${a.hash} 到代码库 ${a.repo} 的 ${a.branch} 分支${a.files?`（${a.files} 个文件）`:''}`,
    pr:`发起合并请求 #${a.id}「${a.title}」，审查人：${a.reviewer}`,merge:`合并请求 #${a.pr}「${a.title}」已合并到 main（${a.hash}）`,
    conflict:`合并请求 #${a.pr} 有冲突，需要处理`,test:`跑了自动化测试：通过 ${a.pass} 项，失败 ${a.fail} 项`,db:`建立业务数据库：${a.name}`,tag:`打上发布标签 ${a.name}`})[a.type];
  for(const a of arts||[]){const t=fmt(a);if(t) addLog(e,{kind:'tool',text:t});}
}

/* ---------- staff ---------- */
// kinds of AI you can hire; every hire of a kind is a separate person (own name, preferences, experience) on that kind's model

    pitch:'先把需求想清楚，我再动笔。',

      {dress:'#ff7a1a',trim:'#fbf6ee',collar:'#fbf6ee',legs:'#fbf6ee',shoes:'#2a1c1c'},
      {dress:'#2a1c1c',trim:'#ff7a1a',apron:true,legs:'#2a1c1c',shoes:'#2a1c1c'}]},
  gpt:{model:'GPT',nick:'GPT娘',names:['阿 G','小 G','吉皮','白龙'],traits:['精明强干','大姐大','雷厉风行','偶尔自信过头'],speed:4,memory:4,price:0.10,

    outfits:[{dress:'#ffffff',trim:'#d6ae46',gold:true,legs:'#ffffff'},{dress:'#2a2836',trim:'#d6ae46',collar:'#ffffff',legs:'#2a2836'},{dress:'#e9e4ff',trim:'#9a62d8',legs:'#ffffff'}]},
  // 鲸鱼娘 (character by ZipZipPipe & 上善无形; see github.com/Neko3000/deepseek-whalechan), coloured after the boss's reference:
  // long indigo-blue hair with a cowlick, pale pointed fin ears angled up, white maid headdress, deep-sea navy maid dress,

  deepseek:{model:'DeepSeek',nick:'DeepSeek娘',names:['阿深','深深','鲸鲸','小蓝'],traits:['元气可爱','饭量无底','有点傲娇','没电就摸鱼'],speed:3,memory:3,price:0.03,
    pitch:'先给我一碗白饭，推理马上开始！',
    look:{hair:'#4d62b0',hairShade:'#314384',hairLight:'#7089d8',eyes:'#3f78e0',skin:'#fbf1ea',style:'long',
      fin:'#e6edf7',finEdge:'#9fb0d6',tail:'#1d2d60',tailBelly:'#8a97bd',acc:['elfFins','ahoge','maidCap','whaleTail','glasses','whaleClip']},
    outfits:[{dress:'#1d2d60',trim:'#ffffff',maid:true,bow:'#749ce0',legs:'#f4f4f8',stripes:'#749ce0',shoes:'#081350'},
      {dress:'#1d2d60',trim:'#749ce0',collar:'#ffffff',legs:'#f4f4f8',shoes:'#302e37'},

const PALETTE=['#c47a5a','#5a9a8a','#9a7ac0','#c0a050'];
const shade=(hex,f)=>'#'+[1,3,5].map(i=>Math.max(0,Math.min(255,Math.round(parseInt(hex.slice(i,i+2),16)*f)))).map(v=>v.toString(16).padStart(2,'0')).join('');
function applyCustomTypes(){
  (MODELS?.custom_types||[]).forEach((t,i)=>{
    if(TYPES[t.type]) return;
    const c=PALETTE[i%PALETTE.length];
    TYPES[t.type]={model:t.label,nick:t.label,names:t.names.length?t.names:[t.label],traits:t.traits.length?t.traits:['新同事'],speed:3,memory:4,price:0.05,
      pitch:t.pitch||`我用的是${t.label}。`,
      look:{hair:c,hairShade:shade(c,.75),hairLight:shade(c,1.3),eyes:shade(c,.6),skin:'#f6d9c4',style:'long',acc:[]},
      outfits:[{dress:shade(c,.55),trim:'#ffffff',collar:'#ffffff',legs:'#2b2838'}]};
  });
  if(MODELS?.config_error) toast(MODELS.config_error,'warn');
}
function nextName(type){
  const used=new Set(state.emps.map(e=>e.name)),t=TYPES[type];
  return t.names.find(n=>!used.has(n))||`${t.names[0]} ${state.emps.filter(e=>e.type===type).length+1}号`;
}

/* ---------- posts: everyone holds one, and new work goes to whoever holds the matching post ---------- */
// kw: words in an order that point to this post
const POSTS={
  pm:{label:'产品经理',does:'需求、PRD、方案',kw:/需求|PRD|prd|方案|规划|功能/},
  design:{label:'设计',does:'界面、线框图、视觉',kw:/设计|界面|线框|UI|视觉|原型|海报/},
  writer:{label:'文案写作',does:'文章、文案、公告、指南',kw:/文案|文章|公告|指南|手册|稿|介绍|邮件/},
  research:{label:'调研分析',does:'竞品、调研、复盘、数据',kw:/调研|竞品|对比|分析|反馈|复盘|报告|数据|价格|大纲/},
  backend:{label:'后端开发',does:'接口、数据库、脚本、修 bug',kw:/后端|接口|数据库|API|脚本|修复|bug|报错|代码/},
  frontend:{label:'前端开发',does:'页面、交互、小程序',kw:/前端|页面|网页|小程序|H5|交互/},
  qa:{label:'测试',does:'测试、验收、审查',kw:/测试|回归|审查|检查/},
  general:{label:'通用',does:'什么都接，岗位上没人时补位'},
};
// a new hire's starting post, by kind; the boss can change it any time
const DEFAULT_POST={claude:'pm',gpt:'writer',deepseek:'backend',gemini:'research',codex:'frontend'};
const postLabel=k=>POSTS[k]?.label||'通用';
const postOptions=sel=>Object.entries(POSTS).map(([k,p])=>`<option value="${k}"${k===sel?' selected':''}>${p.label} · ${p.does}</option>`).join('');
// the post an order belongs to: the boss's choice, else guessed from its words (first match in this order wins)
function postOf(t){
  const s=specOf(t);
  if(POSTS[s.post]) return s.post;
  const text=`${t.title} ${s.detail||t.brief||''} ${s.deliverable.name||''}`;
  if(s.deliverable.kind==='code') return POSTS.frontend.kw.test(text)?'frontend':'backend';
  return ['qa','writer','backend','research','pm','design','frontend'].find(k=>POSTS[k].kw.test(text))||'general';
}
// who takes an order now: a free person in its post, else a free generalist; if nobody holds the post at all, anyone free
// (own: only people in the post or generalists, so orders with a proper owner go out before others borrow that owner)
function pickFor(t,own){
  const post=postOf(t),free=state.emps.filter(e=>!busy(e));
  const best=l=>l.sort((a,b)=>b.stamina-a.stamina)[0]||null;
  return best(free.filter(e=>e.post===post))||best(free.filter(e=>e.post==='general'))
    ||(own||state.emps.some(e=>e.post===post)?null:best(free));
}
// a strict order also gets a second pair of eyes: a free tester if there is one, otherwise any free colleague
function reviewerFor(lead){
  const free=state.emps.filter(e=>!busy(e)&&e!==lead);
  return free.find(e=>e.post==='qa')||free.find(e=>e.post===lead.post)||free[0]||null;
}
// why an order is still on the board
function waitNote(t){
  if(specOf(t).manual) return '等你分配';
  if(!state.auto) return '自动派单关着';
  const post=postOf(t);
  return state.emps.some(e=>e.post===post)?`等${postLabel(post)}空闲`:'等有人空闲';
}
// auto-dispatch: open orders go out urgent first, as soon as the right person is free
function dispatch(){
  if(!state.auto) return;
  const list=[...state.orders].filter(t=>!specOf(t).manual).sort((a,b)=>(specOf(b).priority==='urgent')-(specOf(a).priority==='urgent'));
  // first round: only owners of each post; second round: orders whose post nobody holds borrow whoever is still free
  for(const own of [true,false]) for(const t of list){
    if(!state.orders.includes(t)) continue;
    const e=pickFor(t,own);
    if(!e) continue;
    // a strict order waits until a colleague is also free to review it (unless the lead works alone in the company)
    const strict=specOf(t).check==='strict',r=strict?reviewerFor(e):null;
    if(strict&&!r&&state.emps.length>1) continue;
    startJob(t,r?'team':'solo',r?[e,r]:[e]);
    addLog(e,{kind:'sys',text:`按岗位（${postLabel(e.post)}）自动派单：${t.title}`});
    toast(r?`自动派单：「${t.title}」→ ${e.name} 主写、${r.name} 审查`:`自动派单：「${t.title}」→ ${e.name}（${postLabel(e.post)}）`);
  }
}

function updateHelp(j,s){

    return;
  }
  if(h.stage==='pkt') return;

  }

const nameOf=(j,by)=>by==='A'?j.members[0].name:j.members[1].name;

// stars 0 with auto: accepted without the boss looking (放手); it doesn't count toward the average rating

/* ---------- simulation ---------- */
function update(dt){
  const s=dt*state.speed;
  if(s>0){
    state.minutes+=s*3;
    state.ring=Math.max(0,state.ring-s);
    if(state.arrivals.length&&state.minutes>=state.arrivals[0]) newOrderArrives();
    for(const p of state.projects) if(p.roles.some(r=>r.status==='wait')) tickProject(p);
    if(state.minutes>=18*60) endDay();
    state.dispatchT+=dt;
    if(state.dispatchT>=1){state.dispatchT=0;dispatch();}
  }
  for(const e of state.emps) updateEmp(e,s);
  for(const p of [...state.packets]){p.t+=s;if(p.t>=p.dur){state.packets=state.packets.filter(x=>x!==p);if(p.done) p.done();}}
  for(const j of [...state.jobs]) updateJob(j,s);
  for(const q of [...state.queue]){q.age+=s;if(state.speed===3&&q.risk==='low'&&q.age>1.2) resolve(q,0,true);}
}
function updateEmp(e,s){
  if(s<=0) return;
  e.anim+=s;
  if(e.bubble){e.bubbleT-=s;if(e.bubbleT<=0) e.bubble=null;}
  if(e.path.length){
    const p=e.path[0],dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy),step=38*s;
    if(d<=step){e.x=p.x;e.y=p.y;e.path.shift();}
    else{e.x+=dx/d*step;e.y+=dy/d*step;}
  }else if(!busy(e)&&!e.helping){
    e.wanderT-=s;
    if(e.wanderT<=0){e.wanderT=8+Math.random()*9;const sp=freeLounge();if(sp) goTo(e,sp);}
  }
}
function updateJob(j,s){
  if(j.phase==='gather'){
    if(j.members.every(m=>!m.path.length)){j.phase='run';j.t=0;dirty();}
    return;
  }
  if(j.phase==='help'){if(s>0) updateHelp(j,s);return;}
  if(j.phase!=='run'||s<=0||j.wait) return;
  j.t+=s;
  if(j.t<j.dur) return;
  j.t=0;
  if(j.i>=j.steps.length){finishJob(j);return;}
  const st=j.steps[j.i];
  if(st.k==='ask'){openAsk(j,st);return;}
  if(st.k==='pass'){passStep(j,st);j.i++;return;}
  if(st.k==='help'){openHelp(j,st);return;}
  execStep(j,st);j.i++;
}

function paintArt(cv,t){
  const {a,who,headOnly}=cv._art,c=cv.getContext('2d');
  c.clearRect(0,0,cv.width,cv.height);
  if(!a.ready) return;
  const seed=who?who.name.length*.37:0,working=who&&(who.writing||(who.job&&who.job.phase==='run'));
  // breathing (quicker while working), ahoge swaying, a blink every few seconds, and little hops while waiting on the boss
  const breath=Math.floor(t*(working?2.8:1.2)+seed)%2,sway=[0,1,0,-1][Math.floor(t*1.5+seed)%4];
  const blink=(t+seed)%3.7<.15,hop=!headOnly&&who&&who.waiting?[0,2,3,2,0,0,0,0][Math.floor(t*12)%8]:0;
  const ox=headOnly?-a.head[0]:0,oy=headOnly?-a.head[1]:3-hop;
  c.drawImage(a.img,0,a.legs,a.w,a.h-a.legs,ox,oy+a.legs,a.w,a.h-a.legs);
  c.drawImage(a.img,0,a.ahoge,a.w,a.legs-a.ahoge,ox,oy+a.ahoge+breath,a.w,a.legs-a.ahoge);
  c.drawImage(a.img,0,0,a.w,a.ahoge,ox+sway,oy+breath,a.w,a.ahoge);

    c.fillStyle='#081350';c.fillRect(ox+lx,oy+ly+2+breath,5,1);
  }
}

function draw(){

  if(state.unlocked.server){for(const x of [8,26,78,96]) for(let y=150;y<168;y+=4) R(ctx,(Math.floor(T*2+x+y)%3)?'#78cfa2':'#f2b544',x+10,y,1,1);}

  }

  for(const e of state.emps) items.push([e.y,()=>drawPerson(e)]);
  items.sort((a,b)=>a[0]-b[0]).forEach(i=>i[1]());
  // collaboration links: who is working with whom right now
  for(const j of state.jobs){
    if(j.phase==='review') continue;
    if(j.mode==='solo'){if(j.h) link(j.members[0],j.h.c);continue;}
    if(j.members.some(m=>m.path.length)) continue;
    link(j.members[0],j.members[1]);
  }
  // documents in flight between colleagues
  for(const p of state.packets){
    const k=p.t/p.dur,x=p.from.x+(p.to.x-p.from.x)*k,y=p.from.y-10+(p.to.y-p.from.y)*k-Math.sin(Math.PI*k)*18;

  }
}

}

      // stack bubbles of people standing close together instead of overlapping them
      const bx=Math.min(Math.max(e.x,46),W-46);let by=e.y-30;
      while(placed.some(p=>Math.abs(p.x-bx)<80&&Math.abs(p.y-by)<15)) by-=15;
      placed.push({x:bx,y:by});
      b.style.left=pct(bx,W);b.style.top=pct(by,H);
    }else if(!b.hidden) b.hidden=true;
  }
}

/* ---------- pointer on canvas ---------- */
function toLocal(cx,cy){
  const r=cv.getBoundingClientRect();
  if(cx<r.left||cx>r.right||cy<r.top||cy>r.bottom) return null;
  return {x:(cx-r.left)/r.width*W,y:(cy-r.top)/r.height*H};
}
function empAt(p){
  let hit=null;
  for(const e of state.emps) if(Math.abs(p.x-e.x)<=8&&p.y>=e.y-22&&p.y<=e.y+3&&(!hit||e.y>hit.y)) hit=e;
  return hit;
}
const inRoom=(p,r)=>p.x>=r.x&&p.x<r.x+r.w&&p.y>=r.y&&p.y<r.y+r.h;
function hitTarget(cx,cy){
  const p=toLocal(cx,cy);if(!p) return null;
  const e=empAt(p);if(e) return e.id;
  if(inRoom(p,ROOMS.meeting)) return 'meeting';
  if(inRoom(p,ROOMS.work)) return 'work';
  return null;
}
cv.addEventListener('pointermove',ev=>{const p=toLocal(ev.clientX,ev.clientY);cv.style.cursor=p&&empAt(p)?'pointer':'default';});
cv.addEventListener('click',ev=>{
  const p=toLocal(ev.clientX,ev.clientY);if(!p) return;
  const e=empAt(p);
  if(e){select(e);return;}
  for(const k of ['server','archive']) if(inRoom(p,ROOMS[k])&&!state.unlocked[k]){toast(`${ROOMS[k].label}还没解锁：累计交付 ${ROOMS[k].lock} 个订单后开放。`);return;}
  // the rooms are doors into the real company systems
  if(API.on){
    const go=[['server','#git'],['archive','#docs'],['boss','#records']].find(([k])=>inRoom(p,ROOMS[k]));
    if(go){window.open('/company.html'+go[1],'_blank','noopener');return;}
  }
  if(inRoom(p,ROOMS.meeting)) toast('会议室：把订单拖到这里，两名空闲员工会一起讨论。');
  else if(inRoom(p,ROOMS.work)) toast('工位区：把订单拖到空地上，两名空闲员工会分工协作、互相审查。');
  else if(inRoom(p,ROOMS.boss)) toast('这是你的办公室。员工需要确认时会到门口排队。');
});

/* ---------- order drag ---------- */
const ghost=$('#ghost');
function bindDrag(card,task){
  let sx=0,sy=0,dragging=false,pid=null;
  card.addEventListener('pointerdown',ev=>{if(ev.button!==0) return;sx=ev.clientX;sy=ev.clientY;dragging=false;pid=ev.pointerId;try{card.setPointerCapture(pid);}catch{/* a pointer that already ended can't be captured */}});
  card.addEventListener('pointermove',ev=>{
    if(pid!==ev.pointerId) return;
    if(!dragging&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){dragging=true;closeMenu();ghost.textContent=task.title;ghost.className='ghost';ghost.hidden=false;card.classList.add('dragging');}
    if(dragging){
      ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';
      const t=hitTarget(ev.clientX,ev.clientY);state.dropHover=t;
      // the ghost says what will happen if you let go here
      const [txt,cls]=intentOf(task,t);
      if(ghost.textContent!==txt) ghost.textContent=txt;
      ghost.className='ghost '+cls;
    }
  });
  const end=ev=>{
    if(pid!==ev.pointerId) return;pid=null;
    card.classList.remove('dragging');ghost.hidden=true;
    const t=ev.type==='pointerup'&&dragging?hitTarget(ev.clientX,ev.clientY):null;
    state.dropHover=null;
    if(ev.type!=='pointerup') return;
    if(dragging){if(t) assign(task,t,{x:ev.clientX,y:ev.clientY});else toast('拖到某个员工身上，或者拖进会议室。');}
    else openMenu(task,card);
  };
  card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
  card.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();openMenu(task,card);}});
}

    if(e.job.phase==='help') return '找同事帮忙';
    if(e.job.phase==='gather') return e.job.mode==='meet'?'去会议室':'回工位';
    return e.job.mode==='meet'?'开会中':e.job.mode==='team'?(e.job.wait?'交接中':'协作中'):'工作中';

function placeMenu(a){

function intentOf(task,t){

function launchProject(pl,workorder){

    order_id:pl.order?.id||null,workorder}).then(res=>{
    if(!res) return;

    toast(`已建立代码库「${res.repo}」，工作单存入文档库`,'ok');
    for(const r of p.roles) if(r.status==='run') API.post(`/api/projects/${p.sid}/roles/${r.i}/start`,{});

// start every role whose inputs are ready and whose owner is free
function tickProject(p){
  for(const r of p.roles){
    if(r.status!=='wait'||!r.deps.every(k=>p.roles[k].status==='done')) continue;
    const e=empOf(r.who);
    if(!e||busy(e)) continue;
    r.status='run';
    if(p.sid) API.post(`/api/projects/${p.sid}/roles/${r.i}/start`,{});
    startJob(roleTask(p,r),'solo',[e]);
  }
}
function roleTask(p,r){
  const base={id:uid(),title:`${p.name} · ${r.name}`,brief:r.desc,project:p,role:r,out:{title:r.out||r.name,body:r.desc}};
  if(r.rework){const rw=r.rework;r.rework=null;return {...base,isRework:true,feedback:`${rw.label}。${rw.plan}`,title:`${p.name} · ${r.name}（返工）`,solo:revision('solo',rw)};}
  const deps=r.deps.map(k=>p.roles[k]);
  const steps=[deps.length?{k:'tool',t:`读取上游交付：${deps.map(d=>`${d.out||d.name}（${empName(d.who)}）`).join('、')}`,tok:900}
    :{k:'think',t:`先看项目目标：${p.goal||p.name}`,tok:600},
    {k:'think',t:`我的分工：${r.desc||r.name}`,tok:700}];
  // someone else is working in parallel: sync with them before producing
  const sib=p.roles.find(o=>o!==r&&o.status==='run'&&o.who!==r.who);
  if(sib) steps.push({k:'help',to:sib.who,t:`我在做${r.name}，${sib.name}那边有什么要对齐的？`,reply:`${sib.out||sib.name}按约定的格式出，有变动我马上同步你。`,tok:600});
  steps.push({k:'tool',t:`整理思路，准备写${r.out||r.name}`,tok:1200});
  steps.push({k:'say',t:'准备好了，开始写正式交付物。',tok:200});
  return {...base,solo:steps};
}
// the prep in the office is done; now the employee's own model writes the real deliverable before anything is handed over
function roleDone(j){
  const p=j.task.project,r=j.task.role,e=j.members[0];
  state.jobs=state.jobs.filter(x=>x!==j);e.job=null;
  p.cost+=j.cost;p.decisions.push(...j.decisions);

}
function writeRole(p,r,e,body){
  if(!p.sid){afterWrite(p,r,e,null);return;}
  r.status='writing';e.writing=r;
  const m=modelLabel(e);
  addLog(e,{kind:'sys',text:m?`开始用 ${m} 写正式交付物：${r.out||r.name}`:`开始写正式交付物：${r.out||r.name}（没有接入模型，会用模板）`});
  say(e,m?`正在用 ${m} 写${r.out||r.name}…`:`正在整理${r.out||r.name}…`,'think');
  dirty();
  API.post(`/api/projects/${p.sid}/roles/${r.i}/done`,body).then(res=>afterWrite(p,r,e,res));
}
function afterWrite(p,r,e,res){
  e.writing=null;
  if(res){
    logArtifacts(e,res.artifacts);
    const llm=res.artifacts.find(a=>a.type==='llm');
    if(llm&&llm.cny) chargeReal(e,llm.cny);
    if(r.gate){gateReview(p,r,e,res);return;}
  }
  handOver(p,r,e);
}
// a role the boss asked to see first comes to the door with the real deliverable
function gateReview(p,r,e,res){
  r.status='gate';e.waiting=true;e.carry=true;
  say(e,'老板，这份要请你先看一下');
  state.queue.push({id:uid(),type:'gate',p,r,e,res,risk:'high',age:0});
  placeQueue();renderQueue();dirty();
}
function resolveGate(q,ok,feedback){
  if(!state.queue.includes(q)) return;
  state.queue=state.queue.filter(x=>x!==q);
  const {p,r,e}=q;
  e.waiting=false;e.carry=false;
  const decision=ok?'通过，交给下一位':`需要修改：${feedback}`;
  p.decisions.push(`${r.name}：${decision}`);
  addLog(e,{kind:'boss',text:decision});
  API.post('/api/approvals',{kind:'approve',task:`${p.name} · ${r.name}`,project_id:p.sid,title:`${r.name}做完了：${r.out||r.name}`,detail:q.res.summary||'',
    risk:'high',decision,auto:false,people:[e.name],day:state.day,time:clock()});
  
  if(ok) handOver(p,r,e);
  else{
    say(e,'明白，马上改');goTo(e,e.desk.seat);
    writeRole(p,r,e,{cost:0,decisions:[decision],transcript:[`老板：${decision}`],rework:true,feedback,day:state.day});
  }
  placeQueue();renderQueue();
}
function handOver(p,r,e){
  r.status='done';
  addLog(e,{kind:'sys',text:`完成分工「${r.name}」`});
  for(const o of p.roles.filter(o=>o.deps.includes(r.i))){
    const to=empOf(o.who);
    if(!to||to===e) continue;
    addLog(e,{kind:'pass',text:`交给 ${to.name}：${r.out||r.name}`});
    addLog(to,{kind:'pass',who:e.name,text:`收到 ${r.out||r.name}，用于「${o.name}」`});
    sendPacket(e,to,()=>{say(to,`收到${r.out||r.name}`);bond(e,to);state.stats.collab++;dirty();});
  }
  if(p.roles.every(o=>o.status==='done')) projectToReview(p,e);
  else{say(e,`${r.name}搞定`);goTo(e,freeLounge()||LOUNGE[0]);e.wanderT=4+Math.random()*4;}
  dirty();
}
// whoever finishes last brings the whole project to your door
function projectToReview(p,e){
  e.carry=true;e.waiting=true;say(e,'整个项目做完了，请老板验收');
  const pj={task:{title:p.name,out:{title:`《${p.name}》`,body:p.roles.map(o=>`${o.name}（${empName(o.who)}）：${o.out||'—'}`).join('；')}},
    members:[e],mode:'solo',origMode:'project',decisions:p.decisions,cost:p.cost,reworks:p.reworks,phase:'review',project:p};
  state.queue.push({id:uid(),type:'review',job:pj,risk:'high',age:0});
  placeQueue();renderQueue();
}
function reworkProject(j,key){
  const p=j.project,rs=REASONS[key],last=p.roles[p.roles.length-1],carrier=j.members[0];
  carrier.waiting=false;carrier.carry=false;

}

let plan=null;
function seedPlan(key,over={}){
  const t=TEMPLATES[key],load={};
  // each role goes to someone holding its post, spreading the work; no one in that post, then a generalist, then whoever has least
  const whoFor=post=>{
    const least=l=>l.sort((a,b)=>(load[a.id]||0)-(load[b.id]||0))[0];
    const e=least(state.emps.filter(e=>e.post===post))||least(state.emps.filter(e=>e.post==='general'))||least([...state.emps]);
    if(e) load[e.id]=(load[e.id]||0)+1;
    return e?.id;
  };
  const name=over.name??t.name,goal=over.goal??t.goal,main=postOf({title:name,brief:goal});
  plan={name,goal,order:over.order||null,roles:t.roles.map(r=>({...r,deps:[...r.deps],who:whoFor(r.post||main)}))};
}

/* ---------- toast ---------- */
function toast(msg,kind=''){
  const t=document.createElement('div');t.className='toast '+kind;t.textContent=msg;
  const box=$('#toasts');box.appendChild(t);
  while(box.children.length>3) box.firstChild.remove();
  setTimeout(()=>t.remove(),3800);
}

  for(const s of saved.employees){
    const pr=s.profile||{},type=pr.type||s.id;
    const e=hire(type,false,{id:s.id,name:s.name,persona:pr.persona,variant:pr.variant,post:pr.post});
    if(!e) continue;
    Object.assign(e,{level:s.level||1,xp:s.xp||0,speed:s.speed||e.speed,memory:s.memory||e.memory,stamina:s.stamina??100,spent:s.spent||0,prefs:s.prefs||[],bond:s.bond||{}});
    const sp=freeLounge()||LOUNGE[0];e.spot=sp;e.x=sp.x;e.y=sp.y;
    addLog(e,{kind:'sys',text:'回到公司上班'});
  }
  state.completed=saved.completed||0;
  for(const k of ['server','archive']) state.unlocked[k]=state.completed>=ROOMS[k].lock;
  drawBG();buildRoomLabels();
  state.orders=saved.orders.map(o=>{
    const t=TASKS.find(t=>t.id===o.task_key)||Object.assign(customTask(o.title,o.brief),{id:o.id,est:o.est||'约 ¥1.0'});
    if(o.spec&&Object.keys(o.spec).length){t.spec=o.spec;t.out={...t.out,title:`《${o.spec.deliverable?.name||t.title}》`};}
    return t;
  });
  for(const sp of saved.projects){
    const p={id:uid(),sid:sp.id,name:sp.name,goal:sp.goal,cost:sp.cost||0,reworks:sp.reworks||0,decisions:[],done:false,
      roles:sp.roles.map(r=>({name:r.name,desc:r.description,out:r.output,deps:r.deps,gate:r.gate,who:r.who,i:r.idx,status:r.status==='done'?'done':'wait',rework:null}))};
    state.projects.push(p);
    // a project that was already finished is waiting at the door for review again
    if(p.roles.every(r=>r.status==='done')) projectToReview(p,empOf(p.roles[p.roles.length-1].who)||state.emps[0]);
  }
  state.selected=state.emps[0]||null;
  if(saved.projects.length) toast(`接着做之前的 ${saved.projects.length} 个项目，没做完的分工会重新开始`);
}
async function boot(){
  drawBG();buildRoomLabels();
  const saved=await API.boot();
  if(API.on) MODELS=await fetch('/api/models',{cache:'no-store'}).then(r=>r.json()).catch(()=>null);
  applyCustomTypes();
  // one line per kind of employee: which agent or API really writes for them
  const models=MODELS?(MODELS.fake?'测试替身（不调用真实模型）':Object.entries(MODELS.types).filter(([t])=>TYPES[t]).map(([t,pid])=>{
    const p=MODELS.providers[pid];return `${TYPES[t].model} 员工 → ${p.name}${p.configured?'':`（${p.hint}）`}`;}).join('；')):'';
  $('#conn').textContent=API.on?'已连接 · 交付写进 Git、文档库和数据库':'演示模式 · 记录不会保存';
  $('#conn').title=API.on?models:'没有连接公司后端。在本机运行 node server.js 后打开 http://localhost:5300 使用完整版。';
  $('#sysLink').hidden=!API.on;
  if(saved&&saved.employees.length) restore(saved);
  else await freshStart();
  planArrivals();
  try{state.auto=localStorage.getItem('studio.auto')!=='0';}catch{/* storage blocked: auto stays on */}
  showAuto();
  renderOrders();renderQueue();renderWall();renderHeader();renderBoardHint();renderActive();renderStaff();
}
boot();
// the simulation keeps running in a background tab (agents don't stop working); drawing only happens when visible
let last=performance.now(),acc=0;
setInterval(()=>{
  const now=performance.now();let dt=Math.min(1.5,(now-last)/1000);last=now;T+=dt;acc+=dt;
  while(dt>0){const d=Math.min(.1,dt);update(d);dt-=d;}
  if(acc>.25){acc=0;renderHeader();if(state.dirty){state.dirty=false;renderStaff();renderActive();}}
},40);
function frame(){
  draw();syncOverlay();
  const t=performance.now()/1000;
  for(const cv of artEls){if(cv.isConnected) paintArt(cv,t);else artEls.delete(cv);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
